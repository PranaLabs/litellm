fullnameOverride: litellm
replicaCount: 1
numWorkers: 1
image:
  repository: ghcr.io/berriai/litellm-non_root
  tag: v1.106.6@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  automount: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
nodeSelector:
  cloud.google.com/gke-nodepool: default-pool
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 3Gi
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
service:
  type: ClusterIP
  port: 4000
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "litellm"}'
masterkeySecretName: litellm-runtime
masterkeySecretKey: LITELLM_MASTER_KEY
environmentSecrets:
  - litellm-runtime
db:
  deployStandalone: false
  useExisting: true
  endpoint: litellm-postgresql
  database: litellm
  secret:
    name: litellm-database
    usernameKey: username
    passwordKey: password
redis:
  enabled: false
envVars:
  LITELLM_MODE: PRODUCTION
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  REDIS_HOST: litellm-redis
  REDIS_PORT: "6379"
  STORE_MODEL_IN_DB: "True"
  UI_USERNAME: admin
proxy_config:
  model_list: []
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    store_model_in_db: true
    coordination_redis:
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
  router_settings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
  litellm_settings:
    turn_off_message_logging: true
migrationJob:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
